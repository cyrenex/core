name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      # The default dev runtime, and tests/bun runs with it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: vp check
      - run: vp test
      - run: vp run -r build
