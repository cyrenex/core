name: Release

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit
  pull-requests: write # open the release PR
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      # The default dev runtime, and tests/bun runs with it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: vp check
      - run: vp test
      # Build here, not in a publish lifecycle script, so failures show their output.
      - run: vp run -r build
      - id: changesets
        # v2 is required for Changesets CLI v3 (new .changeset/pre layout).
        uses: changesets/action@v2
        with:
          version-script: vp run version # format the generated CHANGELOG.md
          publish-script: vp run release
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          create-github-releases: true # tag and release on GitHub after npm publish
        env:
          # @changesets/changelog-github reads it in the version script.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # changesets/action only accepts a static title, so add the version afterwards.
      - if: steps.changesets.outputs.pr-number
        run: |
          git fetch origin changeset-release/master
          pkg=$(git show origin/changeset-release/master:packages/cyrenex/package.json)
          name=$(jq -r .name <<<"$pkg")
          version=$(jq -r .version <<<"$pkg")
          gh pr edit "$PR" --title "chore(release): $name@$version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.changesets.outputs.pr-number }}
